name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test
        shell: pwsh
        run: .\build.ps1 -Test -Version "0.0.0-ci.${{ github.run_number }}"

      - name: Upload Coatrack.exe
        uses: actions/upload-artifact@v4
        with:
          name: Coatrack-ci-${{ github.run_number }}
          path: build/Coatrack.exe
          retention-days: 14
